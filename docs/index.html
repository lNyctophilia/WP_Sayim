<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/WP_Sayim/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WP Sayım Yönetim Uygulaması">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A1128">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WP Sayım">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <!-- Explicit Apple Touch Icons for older iOS support (like iOS 15) -->
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg"/>

  <title>WP Sayım</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAIOLuT4e4tAlwXYhKhwxB7qjPojrelZxs"></script>

  <style>
    :root {
      --pwa-bg-color: #0A1128;
      --pwa-accent-color: #3A86FF;
      --pwa-text-color: #8899AA;
    }
    body {
      background-color: var(--pwa-bg-color); /* Uygulamanın ana arka plan rengi */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .web-loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1; /* Flutter canvas'ın altında kalması için */
    }
    .web-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(128, 128, 128, 0.25);
      border-top-color: var(--pwa-accent-color); /* Vurgu rengi */
      border-radius: 50%;
      animation: web-spin 1s linear infinite;
    }
    .web-loading-text {
      margin-top: 16px;
      color: var(--pwa-text-color); /* İkincil metin rengi */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1.5px;
    }
    @keyframes web-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="web-loader-container">
    <div class="web-spinner"></div>
    <div class="web-loading-text">YÜKLENİYOR...</div>
  </div>

  <script>
    // PWA Otomatik Güncelleme ve Hard Cache Temizleme
    async function checkForUpdates() {
      try {
        // Cache'i atlamak için rastgele bir timestamp ekliyoruz
        const response = await fetch('version.json?v=' + new Date().getTime(), {
          cache: 'no-store'
        });
        
        if (!response.ok) return;
        
        const data = await response.json();
        const latestVersion = data.version;
        const currentVersion = localStorage.getItem('appVersion');

        if (currentVersion && latestVersion && currentVersion !== latestVersion) {
          console.log('[PWA Update] Yeni versiyon bulundu!', latestVersion);
          
          // Mevcut Service Worker'ları ve Cache'i temizle
          if (window.caches) {
            try {
              const names = await caches.keys();
              await Promise.all(names.map(name => caches.delete(name)));
              console.log('[PWA Update] Tüm önbellek (cache) başarıyla silindi.');
            } catch (e) {
              console.error('[PWA Update] Önbellek silinirken hata oluştu:', e);
            }
          }
          
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let registration of registrations) {
              // firebase-messaging-sw.js'i KORUYORUZ — unregister edilirse push subscription ölür.
              // Sadece Flutter cache SW'sini (flutter_service_worker.js) kaldırıyoruz.
              const swUrl = registration.active?.scriptURL || registration.installing?.scriptURL || registration.waiting?.scriptURL || '';
              if (swUrl.includes('firebase-messaging-sw')) {
                console.log('[PWA Update] Firebase Messaging SW korunuyor:', swUrl);
                // SW'yi güncelleye zorla (kaldırma)
                try { await registration.update(); } catch(e) {}
                continue;
              }
              await registration.unregister();
            }
          }
          
          // Yeni versiyonu kaydet
          localStorage.setItem('appVersion', latestVersion);
          
          alert('Uygulama güncellendi. Yeni sürüm yükleniyor...');
          window.location.href = window.location.pathname + '?v=' + new Date().getTime();
        } else if (!currentVersion && latestVersion) {
          // İlk açılışta versiyonu kaydet
          localStorage.setItem('appVersion', latestVersion);
        }
      } catch (e) {
        console.error('Update check failed:', e);
      }
    }

    // Uygulama her açıldığında ve görünür olduğunda güncellemeleri kontrol et
    window.addEventListener('load', checkForUpdates);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        checkForUpdates();
        // Uygulamaya dönerken FCM token yenileme sinyali gönder.
        // iOS PWA'da AppLifecycleState.resumed güvenilir çalışmayabileceği için
        // web-native Visibility API üzerinden de token refresh tetikliyoruz.
        window.dispatchEvent(new CustomEvent('fcm-token-refresh-needed', {
          detail: { reason: 'VISIBILITY_CHANGE' }
        }));
      }
    });

    // ─── PWA Safebar (Status Bar) Dinamik Güncelleme ───
    window.updatePwaTheme = function(backgroundColor) {
      const metaThemeColor = document.querySelector('meta[name="theme-color"]');
      if (metaThemeColor) {
        metaThemeColor.setAttribute('content', backgroundColor);
      }
      
      // Sayfa yenilendiğinde tekrar uygulamak için kaydet
      try {
        localStorage.setItem('pwaThemeColor', backgroundColor);
      } catch (e) {}
    };

    // Yüklenişte kaydedilmiş safebar rengini uygula
    (function() {
      const savedBgColor = localStorage.getItem('pwaThemeColor');
      if (savedBgColor) {
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', savedBgColor);
      }
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {

      // ─── iOS SUBSCRIPTION YENİLEME DİNLEYİCİSİ ───
      navigator.serviceWorker.addEventListener('message', function(event) {
        if (!event.data || !event.data.type) return;
        
        const msgType = event.data.type;
        console.log('[SW Message] Mesaj alındı:', msgType);
        
        if (msgType === 'SUBSCRIPTION_CHANGED' || 
            msgType === 'SUBSCRIPTION_EXPIRED' || 
            msgType === 'TOKEN_REFRESH_NEEDED') {
          
          window._swTokenRefreshNeeded = true;
          window.dispatchEvent(new CustomEvent('fcm-token-refresh-needed', { 
            detail: { reason: msgType } 
          }));
          
          console.log('[SW Message] Token yenileme sinyali gönderildi. Sebep:', msgType);
        }
      });

      // ─── FIREBASE MESSAGING SW REGISTER (updateViaCache: none) ───
      const originalRegister = navigator.serviceWorker.register;
      navigator.serviceWorker.register = function(url, options) {
        if (url === '/firebase-messaging-sw.js' || url.includes('firebase-messaging-sw.js')) {
          console.log('[SW Interceptor] Firebase SW isteği yakalandı. Yönlendiriliyor...');
          url = '/WP_Sayim/firebase-messaging-sw.js';
          options = Object.assign({}, options, {
            scope: '/WP_Sayim/firebase-cloud-messaging-push-scope',
            updateViaCache: 'none'
          });
        }
        return originalRegister.call(navigator.serviceWorker, url, options);
      };
    }
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // flutter_bootstrap.js dosyasının önbelleğe alınmasını engellemek için cache buster ekleniyor.
    const bootstrapScript = document.createElement('script');
    bootstrapScript.src = "flutter_bootstrap.js?v=" + new Date().getTime();
    bootstrapScript.async = true;
    document.body.appendChild(bootstrapScript);
  </script>
  <script>
    window.forceShowNotification = async function(title, body) {
      try {
        if (!('serviceWorker' in navigator) || Notification.permission !== 'granted') return;
        
        const registrations = await navigator.serviceWorker.getRegistrations();
        let reg = registrations && registrations.length > 0 ? registrations[0] : await navigator.serviceWorker.ready;
        
        if (reg) {
          await reg.showNotification(title, {
            body: body,
            icon: 'icons/Icon-192.png',
            vibrate: [200, 100, 200],
            requireInteraction: true,
            tag: 'fg-notification-' + Date.now()
          });
          console.log('[forceShowNotification] Native push bildirimi zorla gösterildi!');
        } else {
          new Notification(title, { body: body });
        }
      } catch (err) {
        console.error('[forceShowNotification] Bildirim gösterilirken hata:', err);
      }
    };
  </script>
</body>
</html>
