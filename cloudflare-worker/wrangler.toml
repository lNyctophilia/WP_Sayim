name = "wp-sayim-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
IS_BETA = "false"
APP_BASE_URL = "https://lnyctophilia.github.io/WP_Sayim/"

# Cron Triggers (UTC zamanları — Europe/Istanbul UTC+3)
# sayimAutoReminder: her saat başı (1 saatte bir)
# cleanupOldNotifications: Pazar 05:00 TR → 02:00 UTC
# weeklyFirestoreBackup: Pazar 03:00 TR → 00:00 UTC
# cleanupOldBackups: Pazar 04:00 TR → 01:00 UTC
# hardDeleteSoftDeletedUsers: Her ayın 16'sı 04:00 TR → 01:00 UTC
[triggers]
crons = [
  "0 * * * *",
  "0 2 * * SUN",
  "0 22 * * SAT",
  "0 1 * * SUN",
  "0 1 16 * *"
]

# ─── BETA (TEST) ORTAMI ───
[env.beta]
name = "wp-sayim-api-beta"

[env.beta.vars]
IS_BETA = "true"
APP_BASE_URL = "https://wp-sayim-beta.web.app/"

# Test ortamında cron'ları devre dışı bırakıyoruz (çift bildirim/yedekleme olmaması için)
[env.beta.triggers]
crons = []

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[observability.issues]
enabled = true
